<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Feeding Tracker</title>

<style>
:root{
    --pink-50:#fff8fa;
    --pink-100:#fff0f4;
    --pink-200:#ffdce7;
    --pink-300:#ffc3d5;
    --pink-400:#ef9db8;
    --pink-500:#dc7197;
    --pink-700:#a84265;
    --ink:#35232b;
    --muted:#8f6f7b;
    --line:#f1d7df;
    --success:#2f9d68;
    --danger:#d95d73;
    --shadow:0 12px 35px rgba(172,81,112,.12);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    font-family:Arial,sans-serif;
    color:var(--ink);
    background:
        radial-gradient(circle at 15px 15px,rgba(255,195,213,.38) 0 5px,transparent 6px),
        linear-gradient(135deg,#fff 0%,#fff7fa 48%,#fff 100%);
    background-size:55px 55px,auto;
}

button,
input,
select{
    font:inherit;
}

/* APP */
.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:10px 8px 24px;
}

/* TOP BAR */
.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
}

.icon-btn{
    width:40px;
    height:40px;
    flex:none;
    display:grid;
    place-items:center;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.9);
    color:var(--pink-700);
    cursor:pointer;
    box-shadow:0 4px 14px rgba(172,81,112,.08);
    transition:.2s;
}

.icon-btn:hover{
    transform:translateY(-2px);
    background:var(--pink-50);
}

.brand{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:16px;
    background:rgba(255,255,255,.88);
    box-shadow:var(--shadow);
}

.brand h1{
    margin:0;
    font-size:clamp(17px,4vw,27px);
    color:var(--pink-700);
}

/* MAIN CARD */
.card{
    width:100%;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(241,215,223,.85);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

/* DATE AREA */
.page-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:10px;
    border-bottom:1px solid var(--line);
}

.date-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:7px 9px;
    border-radius:10px;
    background:var(--pink-50);
    color:var(--pink-700);
    font-weight:700;
    font-size:12px;
}

.page-info{
    color:var(--muted);
    font-size:11px;
    text-align:right;
}

/* TABLE - NO SCROLL */
.table-wrap{
    width:100%;
    overflow:hidden;
}

table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
}

/* COLUMN WIDTHS */
th:nth-child(1),
td:nth-child(1){
    width:7%;
}

th:nth-child(2),
td:nth-child(2){
    width:24%;
}

th:nth-child(3),
td:nth-child(3){
    width:9%;
}

th:nth-child(4),
td:nth-child(4){
    width:16%;
}

th:nth-child(5),
td:nth-child(5){
    width:17%;
}

th:nth-child(6),
td:nth-child(6){
    width:27%;
}

/* TABLE HEADINGS */
th{
    padding:7px 2px;
    background:var(--pink-100);
    color:var(--pink-700);
    font-size:11px;
    line-height:1.25;
    word-break:break-word;
    text-align:center;
}

/* TABLE CELLS */
td{
    padding:6px 2px;
    border-top:1px solid #f7e7ec;
    text-align:center;
    vertical-align:middle;
    font-size:11px;
    overflow:hidden;
}

tbody tr{
    transition:.18s;
}

tbody tr:hover{
    background:#fffafd;
}

/* DROPDOWNS */
select{
    width:100%;
    min-width:0;
    max-width:100%;
    padding:7px 2px;
    border:1px solid var(--pink-300);
    border-radius:8px;
    color:var(--ink);
    background-color:#fff;
    cursor:pointer;
    font-size:11px;
    text-align:center;
}

select:focus,
input:focus{
    outline:none;
    border-color:var(--pink-500);
    box-shadow:0 0 0 3px rgba(220,113,151,.15);
}

/* CHECKBOX */
.check{
    width:17px;
    height:17px;
    accent-color:var(--pink-500);
    cursor:pointer;
}

/* TIME */
.time-box{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
}

.manual-time{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1px;
    padding:3px;
    border:1px solid var(--pink-200);
    border-radius:8px;
    background:var(--pink-50);
}

.manual-time select{
    min-width:0;
    width:30%;
    padding:3px 0;
    border:0;
    background:transparent;
    font-size:10px;
}

.time-value{
    font-weight:700;
    color:var(--pink-700);
    white-space:normal;
    word-break:break-word;
    font-size:11px;
}

/* GENERAL BUTTONS */
.btn{
    border:0;
    border-radius:9px;
    padding:8px 9px;
    cursor:pointer;
    font-weight:700;
    transition:.2s;
    font-size:11px;
    text-align:center;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:active{
    transform:translateY(0);
}

.btn-primary{
    background:linear-gradient(135deg,var(--pink-500),var(--pink-400));
    color:white;
    box-shadow:0 7px 16px rgba(220,113,151,.24);
}

.btn-soft{
    background:var(--pink-100);
    color:var(--pink-700);
}

.btn-danger{
    background:#fff1f3;
    color:var(--danger);
}

.btn-small{
    padding:5px 4px;
    font-size:9px;
    line-height:1.2;
}

.time-box .btn-small{
    width:100%;
}

/* ACTION BUTTONS - CENTERED */
.action-cell{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    padding:2px;
}

.action-cell .btn{
    width:85%;
    min-height:28px;
    padding:6px 3px;
    font-size:10px;
    font-weight:800;
    border-radius:8px;
    white-space:nowrap;
    text-align:center;
}

/* SUMMARY */
.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    padding:10px;
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,#fff,#fff9fb);
}

.summary-item{
    padding:9px;
    border:1px solid var(--line);
    border-radius:12px;
    background:white;
}

.summary-label{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:4px;
}

.summary-value{
    font-size:15px;
    font-weight:800;
}

.status-success{
    color:var(--success);
}

.status-warning{
    color:var(--danger);
}

/* BOTTOM CONTROLS */
.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    padding:12px 0 0;
}

.controls .btn{
    flex:1;
    min-width:90px;
}

/* MOBILE */
@media(max-width:600px){

    .app{
        padding:6px 4px 18px;
    }

    .topbar{
        gap:5px;
        margin-bottom:7px;
    }

    .icon-btn{
        width:34px;
        height:34px;
        border-radius:10px;
    }

    .brand{
        padding:8px 4px;
    }

    .brand h1{
        font-size:16px;
    }

    .card{
        border-radius:13px;
    }

    .page-meta{
        padding:7px;
    }

    .date-badge{
        padding:6px 7px;
        font-size:10px;
    }

    .page-info{
        font-size:9px;
    }

    /* MOBILE COLUMN WIDTHS */
    th:nth-child(1),
    td:nth-child(1){
        width:7%;
    }

    th:nth-child(2),
    td:nth-child(2){
        width:24%;
    }

    th:nth-child(3),
    td:nth-child(3){
        width:9%;
    }

    th:nth-child(4),
    td:nth-child(4){
        width:16%;
    }

    th:nth-child(5),
    td:nth-child(5){
        width:17%;
    }

    th:nth-child(6),
    td:nth-child(6){
        width:27%;
    }

    th{
        padding:6px 1px;
        font-size:9px;
    }

    td{
        padding:5px 1px;
        font-size:9px;
    }

    select{
        padding:5px 0;
        font-size:9px;
        border-radius:6px;
    }

    .check{
        width:15px;
        height:15px;
    }

    .btn{
        font-size:10px;
        padding:7px 5px;
    }

    .btn-small{
        font-size:8px;
        padding:4px 2px;
    }

    .manual-time{
        padding:2px;
    }

    .manual-time select{
        font-size:8px;
        padding:2px 0;
    }

    .time-value{
        font-size:9px;
    }

    .time-box{
        gap:3px;
    }

    /* CENTERED CLEAR AND DELETE */
    .action-cell{
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        gap:4px;
        padding:2px;
    }

    .action-cell .btn{
        width:88%;
        min-height:27px;
        padding:5px 2px;
        font-size:9px;
        font-weight:800;
        white-space:nowrap;
        text-align:center;
    }

    .summary{
        gap:5px;
        padding:7px;
    }

    .summary-item{
        padding:7px 5px;
        border-radius:9px;
    }

    .summary-label{
        font-size:9px;
    }

    .summary-value{
        font-size:12px;
    }

    .controls{
        gap:5px;
        padding-top:9px;
    }

    .controls .btn{
        min-width:0;
        padding:8px 4px;
    }
}
</style>
</head>

<body>
<main class="app">
    <div class="topbar">
        <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>

        <div class="brand">
            <h1>Baby Feeding Tracker ✨</h1>
        </div>

        <button class="icon-btn" id="deletePageBtn" title="Delete / Clear current page" aria-label="Delete or clear current page">🗑</button>
    </div>

    <section class="card">
        <div id="pages"></div>
    </section>

    <div class="controls">
        <button class="btn btn-primary" id="addBtn">＋ Add Row<br>添加一行</button>
        <button class="btn btn-soft" id="prevPageBtn">← Previous<br>上一页</button>
        <button class="btn btn-soft" id="nextPageBtn">Next →<br>下一页</button>
    </div>
</main>

<script>
const STORAGE_KEY = "babyTrackerData";
const MILK_OPTIONS = [90, 120, 150];
const DIAPER_OPTIONS = ["Pee/尿尿", "Poop/大便"];

let pages = [];
let currentPage = 0;
let loadingData = false;

const $ = selector => document.querySelector(selector);

function formatDate(date){
    return new Intl.DateTimeFormat("en-GB",{
        day:"2-digit", month:"2-digit", year:"numeric"
    }).format(date);
}

function dateKey(date){
    const d = new Date(date);
    d.setHours(0,0,0,0);
    return d.toISOString();
}

function createSelect(options, value = ""){
    const select = document.createElement("select");
    options.forEach(item => {
        const option = document.createElement("option");
        option.value = String(item.value ?? item);
        option.textContent = item.label ?? item;
        select.appendChild(option);
    });
    if(value !== "") select.value = String(value);
    return select;
}

function createMilkSelect(value = "0"){
    const options = [
        {label:"Medicine / 药物", value:"0"},
        ...MILK_OPTIONS.map(amount => ({label:`${amount} ML`, value:String(amount)})),
        {label:"Type ML / 输入奶量", value:"custom"}
    ];

    const select = createSelect(options);
    const savedValue = String(value);

    if([...select.options].some(option => option.value === savedValue)){
        select.value = savedValue;
    }else if(savedValue !== "custom" && !Number.isNaN(Number(savedValue))){
        addCustomMilkOption(select, savedValue);
        select.value = savedValue;
    }

    select.addEventListener("change", () => {
        if(select.value === "custom"){
            const input = prompt("Enter milk amount in ML:\n请输入奶量（ML）：");
            const amount = input === null ? null : Number(input.trim());

            if(amount === null || input.trim() === "" || Number.isNaN(amount) || amount < 0){
                select.value = "0";
            }else{
                addCustomMilkOption(select, String(amount));
                select.value = String(amount);
            }
        }
        refreshCurrentPage();
        saveData();
    });

    return select;
}

function addCustomMilkOption(select, amount){
    const exists = [...select.options].some(option => option.value === String(amount));
    if(exists) return;

    const option = document.createElement("option");
    option.value = String(amount);
    option.textContent = `${amount} ML`;

    select.insertBefore(option, select.querySelector('option[value="custom"]'));
}

function createTimeControl(savedTime = ""){
    if(savedTime){
        return createLoggedTime(savedTime);
    }

    const container = document.createElement("div");
    container.className = "time-box";

    const logButton = document.createElement("button");
    logButton.className = "btn btn-primary btn-small";
    logButton.innerHTML = "Log Time<br>记录时间";
    logButton.addEventListener("click", () => {
        const time = new Date().toLocaleTimeString([],{
            hour:"numeric", minute:"2-digit", hour12:true
        });
        container.replaceWith(createLoggedTime(time));
        saveData();
    });

    const manual = document.createElement("div");
    manual.className = "manual-time";

    const hours = createSelect([
        {label:"HH", value:""},
        ...Array.from({length:12},(_,i)=>({label:String(i+1),value:String(i+1)}))
    ]);

    const minutes = createSelect([
        {label:"MM", value:""},
        ...Array.from({length:60},(_,i)=>{
            const value = String(i).padStart(2,"0");
            return {label:value,value};
        })
    ]);

    const period = createSelect(["AM","PM"]);

    const setButton = document.createElement("button");
    setButton.className = "btn btn-soft btn-small";
    setButton.textContent = "✓";

    setButton.addEventListener("click", () => {
        if(!hours.value || !minutes.value){
            alert("Please select the time.\n请选择时间。");
            return;
        }

        const time = `${hours.value}:${minutes.value} ${period.value}`;
        container.replaceWith(createLoggedTime(time));
        saveData();
    });

    manual.append(hours, document.createTextNode(":"), minutes, period, setButton);
    container.append(logButton, manual);
    return container;
}

function createLoggedTime(time){
    const span = document.createElement("span");
    span.className = "time-value";
    span.textContent = time;
    return span;
}

function createPage(dateString = dateKey(new Date()), rows = []){
    const page = document.createElement("div");
    page.className = "page";

    const date = new Date(dateString);
    date.setHours(0,0,0,0);

    page.dataset.date = date.toISOString();

    page.innerHTML = `
        <div class="page-meta">
            <div class="date-badge">📅 <span>${formatDate(date)}</span></div>
            <div class="page-info"></div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Line<br>行号</th>
                        <th>Time<br>时间</th>
                        <th>Burp<br>拍嗝</th>
                        <th>Milk<br>奶量</th>
                        <th>Diaper<br>尿布</th>
                        <th>Action<br>操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="summary">
            <div class="summary-item">
                <span class="summary-label">Total Milk / 总奶量</span>
                <span class="summary-value milkTotal">0 ML</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Poop Count / 大便次数</span>
                <span class="summary-value poopTotal">0 time today</span>
            </div>
        </div>
    `;

    $("#pages").appendChild(page);
    pages.push(page);

    rows.forEach(row => addRowToPage(page, row, false));
    if(rows.length === 0) addRowToPage(page, {}, false);

    updatePageSummary(page);
    return page;
}

function addRowToPage(page, data = {}, shouldSave = true){
    const tbody = page.querySelector("tbody");
    const row = document.createElement("tr");

    const lineCell = document.createElement("td");
    row.appendChild(lineCell);

    const timeCell = document.createElement("td");
    timeCell.appendChild(createTimeControl(data.time || ""));
    row.appendChild(timeCell);

    const burpCell = document.createElement("td");
    const burp = document.createElement("input");
    burp.type = "checkbox";
    burp.className = "check";
    burp.checked = Boolean(data.burp);
    burp.addEventListener("change", saveData);
    burpCell.appendChild(burp);
    row.appendChild(burpCell);

    const milkCell = document.createElement("td");
    milkCell.appendChild(createMilkSelect(data.milk ?? "0"));
    row.appendChild(milkCell);

    const diaperCell = document.createElement("td");
    const diaper = createSelect(DIAPER_OPTIONS, data.diaper || DIAPER_OPTIONS[0]);
    diaper.addEventListener("change", () => {
        updatePageSummary(page);
        saveData();
    });
    diaperCell.appendChild(diaper);
    row.appendChild(diaperCell);

    const actionCell = document.createElement("td");
    actionCell.className = "action-cell";

    const clearButton = document.createElement("button");
    clearButton.className = "btn btn-soft btn-small";
    clearButton.textContent = "Clear";
    clearButton.addEventListener("click", () => {
        timeCell.replaceChildren(createTimeControl());
        burp.checked = false;
        milkCell.replaceChildren(createMilkSelect("0"));
        diaper.value = DIAPER_OPTIONS[0];
        updatePageSummary(page);
        saveData();
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "btn btn-danger btn-small";
    deleteButton.textContent = "Delete";
    deleteButton.addEventListener("click", () => {
        if(!confirm("Delete this row?")) return;
        row.remove();
        renumberRows(page);
        updatePageSummary(page);
        saveData();
    });

    actionCell.append(clearButton, deleteButton);
    row.appendChild(actionCell);

    tbody.appendChild(row);
    renumberRows(page);
    updatePageSummary(page);

    if(shouldSave) saveData();
}

function renumberRows(page){
    [...page.querySelectorAll("tbody tr")].forEach((row,index) => {
        row.cells[0].textContent = index + 1;
    });
}

function updatePageSummary(page){
    const milkSelects = page.querySelectorAll("tbody td:nth-child(4) select");
    const diaperSelects = page.querySelectorAll("tbody td:nth-child(5) select");

    const total = [...milkSelects].reduce((sum, select) => {
        return sum + (Number(select.value) || 0);
    }, 0);

    const poopCount = [...diaperSelects]
        .filter(select => select.value === "Poop/大便").length;

    const milkTotal = page.querySelector(".milkTotal");
    milkTotal.textContent = `${total} ML`;
    milkTotal.className = `summary-value milkTotal ${
        total >= 720 ? "status-success" : "status-warning"
    }`;

    page.querySelector(".poopTotal").textContent =
        `${poopCount} time${poopCount === 1 ? "" : "s"} today · 今天大便${poopCount}次`;
}

function updatePageInfo(){
    $(".page-info").innerHTML =
        `Page ${currentPage + 1} of ${pages.length}<br>第${currentPage + 1}页，共${pages.length}页`;
}

function showPage(index){
    if(index < 0 || index >= pages.length) return;

    pages.forEach((page,i) => page.style.display = i === index ? "block" : "none");
    currentPage = index;

    updatePageInfo();
    updateNavigation();
    updatePageSummary(pages[currentPage]);
}

function updateNavigation(){
    $("#prevPageBtn").style.display = currentPage === 0 ? "none" : "";
    $("#nextPageBtn").textContent =
        currentPage < pages.length - 1 ? "Next →" : "Next Day →";
}

function refreshCurrentPage(){
    if(pages[currentPage]) updatePageSummary(pages[currentPage]);
}

function getPageRows(page){
    return [...page.querySelectorAll("tbody tr")].map(row => ({
        time: row.cells[1].querySelector(".time-value")?.textContent || "",
        burp: row.cells[2].querySelector("input").checked,
        milk: row.cells[3].querySelector("select").value,
        diaper: row.cells[4].querySelector("select").value
    }));
}

function saveData(){
    const data = {
        currentPage,
        pages: pages.map(page => ({
            date: page.dataset.date,
            rows: getPageRows(page)
        }))
    };

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadData(){
    loadingData = true;

    try{
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

        if(saved?.pages?.length){
            $("#pages").replaceChildren();
            pages = [];

            saved.pages.forEach((pageData,index) => {
                // Supports the older array-only save format too.
                if(Array.isArray(pageData)){
                    const date = new Date();
                    date.setDate(date.getDate() + index);
                    createPage(dateKey(date), pageData);
                }else{
                    createPage(pageData.date || dateKey(new Date()), pageData.rows || []);
                }
            });

            currentPage = Math.min(saved.currentPage || 0, pages.length - 1);
        }else{
            createPage();
            currentPage = 0;
        }
    }catch(error){
        console.warn("Could not load saved data:", error);
        $("#pages").replaceChildren();
        pages = [];
        createPage();
        currentPage = 0;
    }

    loadingData = false;
    showPage(currentPage);
    saveData();
}

function addNextPage(){
    const lastPage = pages[pages.length - 1];
    const nextDate = new Date(lastPage.dataset.date);
    nextDate.setDate(nextDate.getDate() + 1);

    createPage(dateKey(nextDate));
    showPage(pages.length - 1);
    saveData();
}

function deleteCurrentPage(){
    if(!pages.length) return;

    if(pages.length === 1){
        if(!confirm("Clear all records on this page?\n清除此页面的所有记录？")) return;

        const page = pages[0];
        page.querySelector("tbody").replaceChildren();
        addRowToPage(page, {}, false);
        currentPage = 0;

        showPage(0);
        saveData();
        return;
    }

    if(!confirm("Delete this page and all its records?\n删除此页面及所有记录？")) return;

    const deletedPage = pages[currentPage];
    deletedPage.remove();
    pages.splice(currentPage, 1);

    currentPage = Math.min(currentPage, pages.length - 1);

    showPage(currentPage);
    saveData();
}

$("#addBtn").addEventListener("click", () => {
    addRowToPage(pages[currentPage]);
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
});

$("#prevPageBtn").addEventListener("click", () => {
    showPage(currentPage - 1);
    window.scrollTo({top:0,behavior:"smooth"});
});

$("#nextPageBtn").addEventListener("click", () => {
    if(currentPage < pages.length - 1){
        showPage(currentPage + 1);
    }else{
        addNextPage();
    }
    window.scrollTo({top:0,behavior:"smooth"});
});

$("#deletePageBtn").addEventListener("click", deleteCurrentPage);

$("#fullscreenBtn").addEventListener("click", async () => {
    if(document.fullscreenElement){
        await document.exitFullscreen();
    }else{
        await document.documentElement.requestFullscreen();
    }
});

document.addEventListener("fullscreenchange", () => {
    $("#fullscreenBtn").textContent = document.fullscreenElement ? "✕" : "⛶";
});

loadData();
</script>
</body>
</html>
